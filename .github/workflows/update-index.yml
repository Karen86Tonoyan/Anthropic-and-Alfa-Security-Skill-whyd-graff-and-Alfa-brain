name: Update marketplace index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate index.json
        run: |
          python3 << 'EOF'
          import os, json, re, glob
          from datetime import datetime, timezone

          skills = []

          for skill_md in sorted(glob.glob("skills/**/SKILL.md", recursive=True)):
              skill_dir = os.path.dirname(skill_md)
              skill_name = os.path.basename(skill_dir)
              with open(skill_md, "r", encoding="utf-8") as f:
                  content = f.read()
              fm_match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
              description = ""
              if fm_match:
                  fm = fm_match.group(1)
                  m = re.search(r"^description:\s*(.+)$", fm, re.MULTILINE)
                  if m:
                      val = m.group(1).strip().strip('"')
                      if val in (">-", ">", "|", "|-"):
                          lines = fm[m.end():].split("\n")
                          desc_lines = []
                          for line in lines[1:]:
                              if line and not line[0].isspace():
                                  break
                              desc_lines.append(line.strip())
                          description = " ".join(l for l in desc_lines if l)
                      else:
                          description = val
              skills.append({
                  "name": skill_name,
                  "description": description,
                  "domain": "cybersecurity",
                  "path": os.path.relpath(skill_dir)
              })

          index = {
              "version": "1.2.0",
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repository": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'Karen86Tonoyan/Anthropic-and-Alfa-Security-Skill-whyd-graff-and-Alfa-brain')}",
              "domain": "cybersecurity",
              "total_skills": len(skills),
              "skills": skills
          }

          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Updated index.json: {len(skills)} skills")
          EOF

      - name: Commit updated index
        run: |
          git config user.name "mukul975"
          git config user.email "mukuljangra5@gmail.com"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: auto-update index.json"
          git push
